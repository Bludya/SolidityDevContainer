volumes:
  solidity_dev:
    driver: local

services:
  solidity-workspace:
    image: solidity-workspace
    container_name: solidity-workspace
    build:
      dockerfile: .devcontainer/dockerfile
      context: ../
      args:
        MNT_PATH: "$MNT_PATH"
        PASS: "$PASS"
        USER_ID: "$USER_ID"
        USER_NAME: "$USER_NAME"
        GROUP_ID: "$GROUP_ID"
        GROUP_NAME: "$GROUP_NAME"
        DOCKER_GROUP_ID: "$DOCKER_GROUP_ID"
        GIT_EMAIL: "$GIT_EMAIL"
        GIT_NAME: "$GIT_NAME"
    restart: unless-stopped
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "../:$MNT_PATH"
      - '$SSH_PATH:/home/$USER_NAME/ssh'
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "1"
